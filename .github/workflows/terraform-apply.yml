name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - infra/terraform/**
      - src/lambda/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: apply
    runs-on: ubuntu-24.04
    environment: production
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Mask account ID
        run: |
          id=$(aws sts get-caller-identity --query Account --output text 2> /dev/null) || { echo "get-caller-identity failed"; exit 1; }
          echo "::add-mask::$id"
      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          rc=0
          terraform init -input=false -no-color -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" > "$RUNNER_TEMP/init.log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "terraform init failed (exit $rc)"
            echo "terraform init failed (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: terraform plan
        run: |
          rc=0
          terraform plan -input=false -no-color -detailed-exitcode -out="$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "terraform plan failed (exit $rc)"
            echo "terraform plan failed (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Plan summary
        run: ../../.github/scripts/tf-summary.sh "$RUNNER_TEMP/tfplan"
      - name: Freshness check
        id: fresh
        run: |
          rc=0
          git fetch --no-tags --depth=1 origin main > /dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "git fetch failed (exit $rc)"
            echo "git fetch failed (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          head_sha=$(git rev-parse FETCH_HEAD)
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$GITHUB_SHA" "$head_sha" -- ':/infra/terraform' ':/src/lambda' > /dev/null 2>&1; then
            {
              echo "main は先行していますが、infra/terraform と src/lambda の内容は同一のため apply します"
              echo
              echo "- このコミット: \`${GITHUB_SHA:0:7}\`"
              echo "- main の先頭: \`${head_sha:0:7}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::より新しいコミットが main にあるため apply しません (${GITHUB_SHA:0:7} -> ${head_sha:0:7})"
            {
              echo "より新しいコミットが main にあるため apply しません"
              echo
              echo "- このコミット: \`${GITHUB_SHA:0:7}\`"
              echo "- main の先頭: \`${head_sha:0:7}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi
      - name: terraform apply
        if: steps.fresh.outputs.apply == 'true'
        run: |
          rc=0
          terraform apply -input=false -no-color "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/apply.log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "terraform apply failed (exit $rc)"
            echo "terraform apply failed (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "terraform apply succeeded (commit ${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/tfplan* "$RUNNER_TEMP"/*.json
