name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - run: uv run pytest

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck host/install.sh host/scripts/craftlatch-rotate-key host/lib/mc-stop .github/scripts/tf-summary.sh

  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -no-color infra/
      - name: terraform init and validate
        env:
          TF_IN_AUTOMATION: "1"
          TF_INPUT: "0"
        run: |
          for dir in infra/terraform infra/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly -no-color
            terraform -chdir="$dir" validate -no-color
          done
