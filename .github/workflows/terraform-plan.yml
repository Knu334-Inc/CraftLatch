name: terraform-plan

on:
  pull_request:
    paths:
      - infra/terraform/**
      - src/lambda/**

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: plan
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Mask account ID
        run: |
          id=$(aws sts get-caller-identity --query Account --output text 2> /dev/null) || { echo "get-caller-identity failed"; exit 1; }
          echo "::add-mask::$id"
      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          rc=0
          terraform init -input=false -no-color -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" > "$RUNNER_TEMP/init.log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "terraform init failed (exit $rc)"
            echo "terraform init failed (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: terraform plan
        run: |
          rc=0
          terraform plan -input=false -no-color -detailed-exitcode -out="$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "terraform plan failed (exit $rc)"
            echo "terraform plan failed (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Plan summary
        run: ../../.github/scripts/tf-summary.sh "$RUNNER_TEMP/tfplan"
      - name: Cleanup
        if: always()
        run: rm -rf "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/tfplan* "$RUNNER_TEMP"/*.json
